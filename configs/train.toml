# Training settings, with their defaults.
#
# This file lists every setting that affects training. The values here ARE the defaults
# (src/scrabble_ai/config.py), so the file can be used as is, edited, or copied:
#
#     uv run scrabble-ai train --config configs/train.toml --name my-run --hours 8
#
# One-off changes do not need a new file:
#
#     uv run scrabble-ai train --set model.blocks=10 --set model.channels=128 --set train.learning_rate=5e-4
#
# A misspelled section or key is an error, not silently ignored. When a run is resumed it keeps
# the settings saved in its checkpoint; --config and --set then change only what they name.
#
# Speeds quoted below were measured on the RTX 5070 Ti / Ryzen 7 7800X3D (docs/BENCHMARKS.md).

[run]
name = "run"            # outputs go to <out_dir>/<name>/
out_dir = "runs"        # relative to the repo root unless absolute
lexicon = ""            # a name from configs/lexicons.toml; empty = that file's default
leaves = ""             # leave-value file; empty = data/leaves/<lexicon id>.leaves ("zero" = none)
seed = 1                # fixes self-play game seeds and all sampling
hours = 0.0             # stop after this much wall-clock time; 0 = no time limit
max_games = 0           # stop after this many self-play games; 0 = no limit
device = "cuda"
vram_fraction = 0.9     # cap on PyTorch's share of GPU memory. Windows does not raise out-of-memory
                        # when VRAM fills: it spills into system RAM and slows to a crawl. With the
                        # cap, an oversized setting fails immediately instead.

[model]
blocks = 6              # residual blocks. 6x64 scores about 109,000 positions/s; 10x128 about 33,000
channels = 64           # channels per block (multiple of 8)
norm = "none"           # "none": no normalization, each block starts as the identity (fastest).
                        # "group": GroupNorm; about half the speed and 2.7x the training memory.
vector_hidden = 128     # width of the MLP over the non-board inputs (leave, unseen tiles, scalars)
head_hidden = 256       # width of the last hidden layer
value_channels = 8      # per-square channels kept for the head, so it can see where things are
cross_checks = true     # give the network the cross-check planes: for every empty square, which
                        # letters fit given the tiles next to it. This is the only way the network
                        # sees the dictionary. Turn off only to measure what it is worth.
leave_baseline = true   # the network outputs a correction to the static leave value, so an
                        # untrained network already plays like the greedy+leave bot
# Inputs added on 2026-11-14 (src/scrabble_ai/features.py lists them exactly). Each can be turned
# off to measure what it is worth; a network saved before that date has none of them, and like
# the rest of this section they cannot change once a run has started.
extra_scalars = true    # the move's score, how long since the opponent last played all seven
                        # tiles, how much of the unseen pool is blanks, S, J, Q, X, Z, and the
                        # vowel balance of the pool and of the kept tiles
last_move_plane = true  # where the opponent's previous move put its tiles
openness = true         # which empty squares the next player can reach and with how few tiles,
                        # where seven tiles fit, and which triple- and double-word squares are
                        # in reach
hooks = true            # the squares where one letter extends a word on the board, how many
                        # letters fit there, and where an S does
belief_samples = 4      # after each placement, sample this many racks the mover might have had
                        # and weigh each by how good the move played would have been with it;
                        # the expected tiles on the opponent's rack are an input. Each sample
                        # costs one full move generation per move played. 0 = no such input.
kind = "cnn"            # the body of the network. "cnn": residual blocks of 3 x 3 convolutions.
                        # "cnn-global": the same with board-wide pooling in every third block.
                        # "transformer": one token per square and `blocks` layers of attention of
                        # width `channels` (several times slower).
head = "flat"           # "flat": the outputs read a few channels of every square. "pooled": only each
                        # channel's average and maximum over the board, which cannot memorise boards.
win_head = "binary"     # "binary": one win logit. "wdl": win, draw or loss.
aux_heads = false       # helper outputs for training from games: the opponent's next score and bingo,
                        # and where the next two moves land

[selfplay]
games = 256             # games played in lockstep (speed is flat from 256 to 512)
max_candidates = 64     # moves per decision the network evaluates, the best by score + leave value.
                        # 32 is about 30% faster per game; fewer candidates means the network can
                        # never pick a move the static evaluator ranks low.
max_exchanges = 4       # of those, at most this many exchanges
temperature_start = 4.0 # exploration: moves are sampled from softmax(value / temperature), in points.
temperature_end = 0.5   # At 4.0 a move 4 points worse is chosen about 1/e as often as the best.
temperature_decay_games = 300000  # self-play games over which the temperature falls from start to end
win_weight = 0.0        # 0 = choose moves by expected spread; 1 = by win probability; between = blend
win_scale = 100.0       # points that certain victory is worth in that blend

[warmstart]
games = 100000          # games played by the static evaluator before the network plays (0 = skip)
temperature = 6.0       # exploration in those games, so the network also sees poor moves
max_candidates = 16
steps = 2000            # training steps on that data before self-play starts. 100,000 games are
                        # about 2.4 million positions, so one pass is about 2,300 steps of 1,024;
                        # past that, positions repeat and their outcomes start to be memorised.

# The defaults in this section changed on 2026-11-13 after the first two real runs (docs/PLAN.md):
# with replay_ratio 4, Monte Carlo targets and learning rate 1e-3 both networks memorised the
# outcomes of the games in the replay buffer and played far worse than they started.
[train]
batch_size = 1024
learning_rate = 3e-4    # raise towards 1e-3 only if a run is stable and learning slowly
warmup_steps = 500      # linear learning-rate warm-up
weight_decay = 1e-4
grad_clip = 1.0         # maximum gradient norm; 0 = off
value_scale = 50.0      # points per unit of the value output
huber_delta = 2.0       # the value loss is quadratic within this many units (100 points) and linear beyond
win_loss_weight = 0.5   # weight of the win-probability loss relative to the value loss
target = "td"           # the learning rule. "td": each position learns from what followed in its game,
                        # as td_lambda below sets out. "q": deep Q-learning: each position learns from
                        # the best move the network believes the opponent has next (the self-play copy
                        # of the network, synced every actor_sync_steps, is the target network), and
                        # td_lambda is not used. Q-learning takes a maximum over noisy estimates, which
                        # overstates them; that is the risk to watch with it.
td_lambda = 0.7         # 1 = Monte Carlo targets: the spread actually gained from each position on,
                        # whose noise (about 75 points) is what the networks memorised. Below 1,
                        # targets lean on the estimate of the next position instead: far less noise,
                        # some bias. 0.5 to 0.8 is the range to try.
replay_capacity = 3000000  # positions kept, about 370 bytes each (3M = 1.1 GB of RAM)
min_replay = 100000     # positions needed before training starts
replay_ratio = 1.0      # training samples drawn per new self-play position. At 1 each position is
                        # trained on about once. Above 1 the network sees the same games repeatedly
                        # and starts to memorise their outcomes (at 4 it did, badly).
actor_sync_steps = 100  # training steps between copies of the weights into the self-play network
guard = true            # when a network is significantly behind the best one at guard_patience
guard_patience = 2      # evaluations in a row, go back to the best network's weights and halve the
                        # learning rate. A run can then waste time but cannot drift far below its best.
augment_transpose = true   # randomly swap rows and columns: the one exact symmetry of the board
amp = true              # bf16 mixed precision
checkpoint_minutes = 10.0
eval_minutes = 20.0     # how often to evaluate against the baselines and gate against the best
eval_pairs = 250        # seat-swapped pairs per baseline in those evaluations
gate_pairs = 500        # pairs when testing a checkpoint against the current best network
keep_checkpoints = 5    # step_*.pt files kept (best.pt is always kept)

# Training from saved games: `uv run scrabble-ai train-games --games <set> --name <run>`. The
# self-play trainer does not read this section. `train-games` also changes five settings above
# unless told otherwise: model.head = "pooled", model.win_head = "wdl", model.aux_heads = true,
# selfplay.win_weight = 0.9 (pick moves by win chance, points breaking ties) and
# selfplay.max_candidates = 32.
[offline]
games = ""              # the game set to learn from: a name under data/games (`scrabble-ai games`)
passes = 6.0            # times through the set; each pass takes one fresh position from every game
batch_size = 2048
learning_rate = 3e-4    # at its peak; it ramps up, then falls along a cosine to a twentieth of this
warmup_steps = 500
weight_decay = 1e-4
grad_clip = 1.0
validation_games = 20000  # games held out of training (at most a tenth of the set)
validate_steps = 500    # training steps between measurements on them
aux_share = 0.15        # each helper output's pull on the network as a share of the main output's;
                        # 0 = use the two fixed weights below
spread_weight = 0.25    # fixed weight of the points output
aux_weight = 0.1        # fixed weight of each other helper output
eval_minutes = 30.0     # how often the network plays the static evaluator
eval_pairs = 2000       # seat-swapped pairs in those matches (about +/- 1.3 points of win rate)
final_pairs = 10000     # pairs in the match when every pass is done (about +/- 0.6)
checkpoint_minutes = 10.0
keep_checkpoints = 3
augment_transpose = true
amp = true
