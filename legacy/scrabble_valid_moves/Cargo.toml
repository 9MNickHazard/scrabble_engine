[package]
name = "scrabble_valid_moves_rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "scrabble_valid_moves_rust"
crate-type = ["cdylib"]

[dependencies]
csv = "1.3"
itertools = "0.12"
rayon = "1.8"
phf = { version = "0.11", features = ["macros"] }
once_cell = "1.19"
pyo3 = { version = "0.21", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }