[package]
name = "scrabble-py"
description = "Python bindings for scrabble-core (the scrabble_ai._core extension module)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
scrabble-core = { path = "../scrabble-core" }
pyo3 = "0.30"
numpy = "0.30"
